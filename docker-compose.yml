version: '3.9'

# ============================================================
# Kebaya Kini - Production Docker Compose
# Reverse proxy: /sites/pbo/nginx/conf.d/kebayakini.conf
# Proxy container : pbo_nginx_proxy
# Shared network  : pbo_default (external, created by /sites/pbo)
# Internal URL    : http://kebayakini_app:3000
# Public URL      : https://kebayakini.web.id (fallback: kebayaku.web.id)
# ============================================================

services:
  kebayakini_app:
    image: kebayakini-app:latest
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: kebayakini_app
    restart: unless-stopped

    # Runtime environment (kept out of the image)
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://kebayakini.web.id
      - NEXT_PUBLIC_LEGACY_SITE_URL=https://kebayaku.web.id

    # No host port publishing: Nginx reaches the container over pbo_default.
    # For local debugging you may temporarily add:
    #   ports:
    #     - "8017:3000"
    expose:
      - "3000"

    networks:
      pbo_default:
        aliases:
          - kebayakini_app

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  pbo_default:
    external: true
