  <line x1="300" y1="852" x2="500" y2="852" stroke="url(#gold)" stroke-width="2"/>
  <text x="400" y="886" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="4" fill="#8a5d64">FOTO SEGERA HADIR</text>
</svg>
