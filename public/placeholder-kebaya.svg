<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Kebaya Kini placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdf6f0"/>
      <stop offset="55%" stop-color="#f7e7dc"/>
      <stop offset="100%" stop-color="#efd3c2"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b76e79"/>
      <stop offset="100%" stop-color="#8c4a55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c27a"/>
      <stop offset="50%" stop-color="#d4a24c"/>
      <stop offset="100%" stop-color="#b7842f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Decorative frame -->
  <rect x="42" y="42" width="716" height="916" rx="28" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.55"/>
  <circle cx="400" cy="190" r="86" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.5"/>
  <circle cx="400" cy="190" r="66" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.35"/>

  <!-- Kebaya silhouette -->
  <path d="M400 300
           C360 300 330 315 310 340
           C288 366 270 400 250 450
           L205 570
           C198 590 210 606 230 606
           C246 606 256 596 264 578
           L300 492
           L300 700
           C300 726 316 742 342 742
           L458 742
           C484 742 500 726 500 700
           L500 492
           L536 578
           C544 596 554 606 570 606
           C590 606 602 590 595 570
           L550 450
           C530 400 512 366 490 340
           C470 315 440 300 400 300 Z"
        fill="url(#silk)"/>

  <!-- Collar / front opening -->
  <path d="M400 300 L400 742" stroke="#6f3540" stroke-width="3" opacity="0.55"/>
  <path d="M400 300 C382 340 372 390 372 440 L372 742" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>
  <path d="M400 300 C418 340 428 390 428 440 L428 742" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.75"/>

  <!-- Batik / embroidery motifs -->
  <g fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.7">
    <path d="M330 540 q22 -26 44 0 q-22 26 -44 0 Z"/>
    <path d="M426 540 q22 -26 44 0 q-22 26 -44 0 Z"/>
    <path d="M330 610 q22 -26 44 0 q-22 26 -44 0 Z"/>
    <path d="M426 610 q22 -26 44 0 q-22 26 -44 0 Z"/>
    <path d="M378 672 q22 -26 44 0 q-22 26 -44 0 Z"/>
    <circle cx="352" cy="575" r="3"/>
    <circle cx="448" cy="575" r="3"/>
    <circle cx="352" cy="645" r="3"/>
    <circle cx="448" cy="645" r="3"/>
  </g>

  <!-- Selendang -->
  <path d="M318 330 C280 380 262 470 258 560 C256 592 274 606 292 596 C310 586 308 556 312 528 C322 452 338 392 360 352 Z"
        fill="url(#gold)" opacity="0.55"/>
  <path d="M482 330 C520 380 538 470 542 560 C544 592 526 606 508 596 C490 586 492 556 488 528 C478 452 462 392 440 352 Z"
        fill="url(#gold)" opacity="0.55"/>

  <!-- Brand text -->
  <text x="400" y="826" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
